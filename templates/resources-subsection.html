{% extends "base.html" %}

{% block content %}

<script>document.title = "{{ section.title | safe }} - 251.XYZ"</script>

<section class="reading-page">
    <div class="container">
        <h1>{{ section.title }}</h1>
        {{ section.content | safe }}
    </div>
    <br>

    <ul class="page-listing">
        {% for page in section.pages %}
        <li onclick="location.href='{{ page.permalink | safe }}'">{{ page.title }}</li>
        {% endfor %}
    </ul>
</section>

{% endblock %}
