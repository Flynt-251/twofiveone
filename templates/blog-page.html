{% extends "base.html" %}

{% block content %}

<script>
    document.title = "{{ page.title | safe }} - 251.XYZ"
    document.getElementsByTagName("meta").namedItem("description").content = "{{ page.summary | safe }}"
</script>

<section class="reading-page">
    <h1>{{ page.title }}</h1>
    <p class="page-metadata">{{ page.day }}/{{ page.month }}/{{ page.year }} | {{ page.reading_time }} minutes | {{ page.word_count }} words</p><br>
    {{ page.content | safe }}
</section>

{% endblock %}
